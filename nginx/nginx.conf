# ─────────────────────────────────────────────────────────────────────────────
# LastMile – nginx Load Balancer / Reverse Proxy
#
# Upstream layout
#   backend1   → 2 instances of lastmile-backend-1 (round-robin, stateless REST)
#   backend2   → 1 instance  of lastmile-backend-2
#   backend_ws → 2 instances of lastmile-backend-ws (ip_hash required for
#                Socket.IO polling → WebSocket upgrade handshake)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Socket.IO hace polling HTTP antes de hacer upgrade a WebSocket.
    # Este map asegura que Connection sea "upgrade" solo cuando el cliente
    # manda Upgrade header; de lo contrario usa "close" (HTTP normal).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstreams ─────────────────────────────────────────────────────────────

    # Backend-1: identity, campaigns, donations, events (escalado horizontal)
    upstream backend1 {
        server backend1_1:3001;
        server backend1_2:3001;
        # round-robin por defecto – funciona porque JWT es stateless
    }

    # Backend-2: auctions, products, logistics, notifications, chat
    upstream backend2 {
        server backend2:3002;
    }

    # Backend-WS: WebSocket / Socket.IO (2 instancias + Redis adapter)
    # ip_hash garantiza que polling y upgrade vayan al mismo servidor
    upstream backend_ws {
        ip_hash;
        server backend_ws_1:3003;
        server backend_ws_2:3003;
    }

    # ── Server block ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Variables de cabecera compartidas
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Socket.IO (WebSocket) ─────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Backend-1: auth, users, campaigns, donations, events ──────────
        location ~ ^/api/v1/(auth|users|campaigns|donations|events) {
            proxy_pass http://backend1;
        }

        # Swagger de backend-1
        location /api {
            proxy_pass http://backend1;
        }

        # ── Backend-2: auctions, products, logistics, notifications, chat ─
        location ~ ^/api/v1/(auctions|products|logistics|notifications|chat) {
            proxy_pass http://backend2;
        }

        # Health checks
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
